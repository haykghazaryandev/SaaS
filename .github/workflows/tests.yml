# Runs the Pest tests on PostgreSQL 16 + Redis for every push and pull request.
# Railway deploys the staging / main branches itself (GitHub integration, see .railway/railway.ts);
# enable "Wait for CI" on the Railway services so a deploy starts only after this workflow is green.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookball_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip, gd
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: web/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('web/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build          # pages render the Vite manifest
      - run: npx vue-tsc --noEmit   # types: a new error fails CI (and so the deploy)
      - run: npx eslint .
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan route:cache   # like production: catches route-file code that cached routes skip
      - run: ./vendor/bin/pest
