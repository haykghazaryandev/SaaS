# GitLab CI: runs the Pest tests on PostgreSQL 16 + Redis for every push and merge request.
# Works whether the repository root is the Laravel app or the whole "bookball" folder (with the app in web/).

stages: [test]

tests:
  stage: test
  image: php:8.3-cli
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: bookball_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DB_HOST: postgres
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_HOST: redis
    COMPOSER_ALLOW_SUPERUSER: "1"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files: [composer.lock, package-lock.json, web/composer.lock, web/package-lock.json]
    paths: [vendor/, web/vendor/, .npm/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - if [ -f web/artisan ]; then cd web; fi
    # PHP extensions + Composer, Node 22
    - apt-get update -qq && apt-get install -y -qq curl git unzip > /dev/null
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions pdo_pgsql pgsql redis intl bcmath zip gd @composer > /dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null && apt-get install -y -qq nodejs > /dev/null
  script:
    - composer install --no-interaction --prefer-dist --no-progress
    - npm ci
    - npm run build                      # pages render the Vite manifest
    - cp .env.example .env
    - php artisan key:generate
    - ./vendor/bin/pest
